zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: c2c162144c2d4c5491c8801193af4945
    name: Templates/Cloud
  templates:
  - uuid: 081a7961b58a4c3f8bd458920cad28f9
    template: Oracle OCI File Storage by HTTP
    name: Oracle OCI File Storage by HTTP
    description: |
      Enterprise zero-touch monitoring template for Oracle Cloud Infrastructure File Storage (FSS), Zabbix 7.0.

      The template discovers File Systems and Mount Targets tenancy-wide in the configured OCI region through Resource Search. No compartment, File System OCID or Mount Target OCID list is required.

      It collects:
      - File System lifecycle, metered usage, FILE_SYSTEM_LEVEL hard/soft quotas, quota enforcement and violations, export paths, replication/snapshot/KMS metadata;
      - File System read/write throughput, requests by size, read/write latency by size, metadata IOPS and metadata latency;
      - Mount Target lifecycle, private IPs, NSGs, throughput shape, connections, read/write throughput and health;
      - API collector health and errors.

      Raw/API master items have history disabled; only normalized numeric and short metadata items are retained.

      Authentication uses the same OCI request-signing macro names as the official Zabbix Oracle Cloud by HTTP template: {$OCI.API.TENANCY}, {$OCI.API.USER}, {$OCI.API.FINGERPRINT}, {$OCI.API.PRIVATE.KEY}.

      Recommended OCI IAM policy for a dedicated Zabbix API user/group:
        Allow group <ZabbixGroup> to read file-family in tenancy
        Allow group <ZabbixGroup> to read metrics in tenancy
        Allow group <ZabbixGroup> to read virtual-network-family in tenancy
      The last line is needed only when {$OCI.FSS.RESOLVE.PRIVATE.IP}=1.

      Default region is eu-milan-1 and can be changed once on the template/OCI host.
    vendor:
      name: Custom Enterprise
      version: '1.0'
    groups:
    - name: Templates/Cloud
    items:
    - uuid: 1d8400d4e110471f963a1e282dc6175b
      name: 'OCI FSS: Resource discovery raw'
      type: SCRIPT
      key: oci.fss.discovery.raw
      delay: 15m
      history: '0'
      value_type: TEXT
      trends: '0'
      params: |
        function CTlsConfig(raw) {
            raw = String(raw || 'full').trim().toLowerCase();
            if (['none','peer','full'].indexOf(raw) === -1) raw = 'full';
            this.options = {
                SSLVerifyPeer: (raw === 'peer' || raw === 'full'),
                SSLVerifyHost: (raw === 'full')
            };
        }
        function validate(required, p) {
            for (var i = 0; i < required.length; i++) {
                if (typeof p[required[i]] === 'undefined' || p[required[i]] === '')
                    throw 'Required parameter is not set: ' + required[i];
            }
        }
        function OCI(params) {
            this.req = new HttpRequest((new CTlsConfig(params.tls_verify)).options);
            if (params.http_proxy) this.req.setProxy(params.http_proxy);
            this.hash = function(s) { return sha256(s); };
            this.sign = function(s) { return sign('sha256', params.private_key, s); };
            this.encode = function(hash) {
                var hexArr = hash.match(/.{1,2}/g), a = new Uint8Array(hexArr.length);
                hexArr.forEach(function(h, i) { a[i] = parseInt(h, 16); });
                return btoa(a);
            };
            this.date = function() {
                var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                var d=new Date();
                function p(n){return n<10?'0'+n:String(n);}
                return wd[d.getUTCDay()]+', '+p(d.getUTCDate())+' '+mo[d.getUTCMonth()]+' '+d.getUTCFullYear()+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' GMT';
            };
            this.call = function(method, host, path, query, bodyObj) {
                method = method.toLowerCase(); query = query || '';
                var body = bodyObj === null || typeof bodyObj === 'undefined' ? '' : JSON.stringify(bodyObj);
                var attempt=0, response='', status=0, headersObj={};
                while (attempt < 4) {
                    attempt++;
                    this.req.clearHeader();
                    var signed='(request-target) date host';
                    var dateHeader='date: '+this.date();
                    var hostHeader='host: '+host;
                    var target='(request-target): '+method+' '+path+query;
                    var signing=target+'\n'+dateHeader+'\n'+hostHeader;
                    var reqHeaders=['content-type: application/json', dateHeader];
                    if (method !== 'get' && method !== 'head') {
                        signed += ' x-content-sha256 content-type content-length';
                        var hashHeader='x-content-sha256: '+this.encode(this.hash(body));
                        var lenHeader='content-length: '+body.length;
                        signing += '\n'+hashHeader+'\ncontent-type: application/json\n'+lenHeader;
                        reqHeaders.push(hashHeader, lenHeader);
                    }
                    var signature=this.encode(this.sign(signing));
                    reqHeaders.push('Authorization: Signature version="1",keyId="'+params.tenancy_ocid+'/'+params.user_ocid+'/'+params.fingerprint+'",algorithm="rsa-sha256",headers="'+signed+'",signature="'+signature+'"');
                    for (var h=0;h<reqHeaders.length;h++) this.req.addHeader(reqHeaders[h]);
                    var url='https://'+host+path+query;
                    response = method === 'get' ? this.req.get(url) : this.req.post(url, body);
                    status=this.req.getStatus(); headersObj=this.req.getHeaders(false) || {};
                    if (status !== 429 && status < 500) break;
                    Zabbix.sleep(attempt * 500);
                }
                this.req.clearHeader();
                if (status < 200 || status >= 300) {
                    var msg=response;
                    try { var e=JSON.parse(response); msg=e.message || e.code || response; } catch(ignore) {}
                    throw host+path+query+' returned HTTP '+status+': '+msg;
                }
                return {body:response, headers:headersObj, status:status};
            };
        }
        function headerValue(headers, wanted) {
            wanted=String(wanted).toLowerCase();
            for (var k in headers) if (String(k).toLowerCase() === wanted) {
                var v=headers[k]; return Array.isArray(v) ? (v.length ? v[0] : '') : v;
            }
            return '';
        }
        function endpoint(params, kind) {
            var ov=params[kind+'_host'];
            if (ov) return ov.replace(/^https?:\/\//i,'').replace(/\/$/,'');
            var r=params.region, dom=params.realm_domain || 'oraclecloud.com';
            if (kind === 'search') return 'query.'+r+'.oci.'+dom;
            if (kind === 'file') return 'filestorage.'+r+'.'+dom;
            if (kind === 'telemetry') return 'telemetry.'+r+'.'+dom;
            if (kind === 'core') return 'iaas.'+r+'.'+dom;
            throw 'Unknown endpoint kind: '+kind;
        }

        var result={status:0,error:'',filesystems:[],mounttargets:[]};
        try {
            var p=JSON.parse(value);
            validate(['tenancy_ocid','user_ocid','fingerprint','private_key','region'],p);
            var oci=new OCI(p), host=endpoint(p,'search');
            function search(q) {
                var out=[], page='', guard=0;
                do {
                    guard++; if (guard>100) throw 'Resource Search pagination exceeded 100 pages';
                    var qs='?limit=1000'+(page?'&page='+encodeURIComponent(page):'');
                    var r=oci.call('post',host,'/20180409/resources',qs,{type:'Structured',query:q,matchingContextType:'NONE'});
                    var j=JSON.parse(r.body), items=j.items || [];
                    for (var i=0;i<items.length;i++) out.push(items[i]);
                    page=headerValue(r.headers,'opc-next-page');
                } while(page);
                return out;
            }
            function cleanName(x){return x.displayName || x.identifier || 'unnamed';}
            var fs=search('query filesystem resources');
            for (var i=0;i<fs.length;i++) {
                if (fs[i].lifecycleState === 'DELETED') continue;
                result.filesystems.push({
                    '{#FS.ID}':fs[i].identifier,
                    '{#FS.NAME}':cleanName(fs[i]),
                    '{#FS.COMPARTMENT}':fs[i].compartmentId || '',
                    '{#FS.AD}':fs[i].availabilityDomain || '',
                    '{#FS.STATE}':fs[i].lifecycleState || 'UNKNOWN'
                });
            }
            var mt=search('query mounttarget resources');
            for (var m=0;m<mt.length;m++) {
                if (mt[m].lifecycleState === 'DELETED') continue;
                result.mounttargets.push({
                    '{#MT.ID}':mt[m].identifier,
                    '{#MT.NAME}':cleanName(mt[m]),
                    '{#MT.COMPARTMENT}':mt[m].compartmentId || '',
                    '{#MT.AD}':mt[m].availabilityDomain || '',
                    '{#MT.STATE}':mt[m].lifecycleState || 'UNKNOWN'
                });
            }
            result.status=1;
        } catch(e) { result.error=String(e); Zabbix.log(3,'[ OCI FSS discovery ] '+result.error); }
        return JSON.stringify(result);
      timeout: 60s
      parameters:
      - name: tenancy_ocid
        value: '{$OCI.API.TENANCY}'
      - name: user_ocid
        value: '{$OCI.API.USER}'
      - name: fingerprint
        value: '{$OCI.API.FINGERPRINT}'
      - name: private_key
        value: '{$OCI.API.PRIVATE.KEY}'
      - name: region
        value: '{$OCI.FSS.REGION}'
      - name: realm_domain
        value: '{$OCI.FSS.REALM.DOMAIN}'
      - name: search_host
        value: '{$OCI.FSS.SEARCH.HOST}'
      - name: file_host
        value: '{$OCI.FSS.FILE.HOST}'
      - name: telemetry_host
        value: '{$OCI.FSS.TELEMETRY.HOST}'
      - name: core_host
        value: '{$OCI.FSS.CORE.HOST}'
      - name: http_proxy
        value: '{$OCI.HTTP.PROXY}'
      - name: tls_verify
        value: '{$OCI.FSS.TLS.VERIFY}'
      tags:
      - &id001
        tag: component
        value: oci-fss
      - tag: scope
        value: raw
    - uuid: 2a487618e9fa4a67b235e89d7e7daddd
      name: 'OCI FSS: Discovery API status'
      type: DEPENDENT
      key: oci.fss.discovery.status
      delay: '0'
      history: 14d
      trends: 365d
      preprocessing:
