      - value: '1'
        newvalue: ACTIVE
      - value: '2'
        newvalue: UPDATING
      - value: '3'
        newvalue: DELETING
      - value: '4'
        newvalue: DELETED
      - value: '5'
        newvalue: FAILED
      - value: '99'
        newvalue: UNKNOWN
    - uuid: 6ca953d0f7274b7ab4d3cbbf78eadefd
      name: OCI FSS quota enforcement state
      mappings:
      - value: '0'
        newvalue: DISABLED
      - value: '1'
        newvalue: ENABLING
      - value: '2'
        newvalue: ENABLED
      - value: '3'
        newvalue: DISABLING
      - value: '4'
        newvalue: SYNCING
      - value: '5'
        newvalue: FAILED
      - value: '99'
        newvalue: UNKNOWN
