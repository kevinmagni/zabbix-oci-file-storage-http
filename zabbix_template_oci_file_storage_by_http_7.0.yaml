        }

        var out={status:0,error:'',errors:[],fs:{},mt:{}};
        try {
            var p=JSON.parse(value); validate(['tenancy_ocid','user_ocid','fingerprint','private_key','region'],p);
            var oci=new OCI(p), host=endpoint(p,'telemetry');
            var qp='?compartmentId='+encodeURIComponent(p.tenancy_ocid)+'&compartmentIdInSubtree=true';
            function latest(s){var a=s.aggregatedDatapoints||[]; return a.length?Number(a[a.length-1].value):null;}
            function bucket(root,id){if(!root[id])root[id]={};return root[id];}
            function getMetric(name,query,handler){
                try {
                    var r=oci.call('post',host,'/20180401/metrics/actions/summarizeMetricsData',qp,{namespace:'oci_filestorage',query:query});
                    var a=JSON.parse(r.body)||[];
                    for(var i=0;i<a.length;i++){var v=latest(a[i]); if(v===null)continue; handler(a[i].dimensions||{},v);}
                } catch(e){out.errors.push(name+': '+String(e));}
                Zabbix.sleep(130);
            }
            getMetric('FileSystemReadThroughput','FileSystemReadThroughput[1m].groupBy(resourceId).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId).readThroughput=v;});
            getMetric('FileSystemWriteThroughput','FileSystemWriteThroughput[1m].groupBy(resourceId).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId).writeThroughput=v;});
            getMetric('FileSystemReadRequestsbySize','FileSystemReadRequestsbySize[1m].groupBy(resourceId,size).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['readOps_'+d.size]=v;});
            getMetric('FileSystemWriteRequestsbySize','FileSystemWriteRequestsbySize[1m].groupBy(resourceId,size).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['writeOps_'+d.size]=v;});
            getMetric('FileSystemReadAverageLatencybySize','FileSystemReadAverageLatencybySize[1m].groupBy(resourceId,size).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['readLatency_'+d.size]=v;});
            getMetric('FileSystemWriteAverageLatencybySize','FileSystemWriteAverageLatencybySize[1m].groupBy(resourceId,size).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['writeLatency_'+d.size]=v;});
            getMetric('MetadataRequestAverageLatency','MetadataRequestAverageLatency[1m].groupBy(resourceId,operation).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['metaLatency_'+d.operation]=v;});
            getMetric('MetadataIOPS','MetadataIOPS[1m].groupBy(resourceId,operation).mean()',function(d,v){if(d.resourceId)bucket(out.fs,d.resourceId)['metaIops_'+d.operation]=v;});
            getMetric('MountTargetReadThroughput','MountTargetReadThroughput[1m].groupBy(resourceId).mean()',function(d,v){if(d.resourceId)bucket(out.mt,d.resourceId).readThroughput=v;});
            getMetric('MountTargetWriteThroughput','MountTargetWriteThroughput[1m].groupBy(resourceId).mean()',function(d,v){if(d.resourceId)bucket(out.mt,d.resourceId).writeThroughput=v;});
            getMetric('MountTargetConnections','MountTargetConnections[1m].groupBy(resourceId).sum()',function(d,v){if(d.resourceId)bucket(out.mt,d.resourceId).connections=v;});
            getMetric('MountTargetHealth','MountTargetHealth[1m].groupBy(resourceId,healthItem).mean()',function(d,v){if(d.resourceId)bucket(out.mt,d.resourceId)['health_'+d.healthItem]=v;});
            out.status=out.errors.length?0:1;
            if(out.errors.length)out.error=out.errors.join(' | ');
        } catch(e){out.error=String(e); Zabbix.log(3,'[ OCI FSS fast metrics ] '+out.error);}
        return JSON.stringify(out);
      timeout: 60s
      parameters:
      - name: tenancy_ocid
