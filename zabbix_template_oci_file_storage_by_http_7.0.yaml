      name: OCI FSS mount targets discovery
      type: DEPENDENT
      key: oci.fss.mounttargets.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#MT.NAME}'
          value: '{$OCI.FSS.MT.NAME.MATCHES}'
          formulaid: A
        - macro: '{#MT.NAME}'
          value: '{$OCI.FSS.MT.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lifetime: 30d
