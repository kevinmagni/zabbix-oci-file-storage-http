        parameters:
        - |-
          var d=JSON.parse(value);return d.error||'';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: oci.fss.discovery.raw
      tags: &id003
      - *id001
    - uuid: 514b3f93d36d47dcb8d91fc54f95c0be
      name: 'OCI FSS: File systems discovered'
      type: DEPENDENT
      key: oci.fss.filesystems.count
