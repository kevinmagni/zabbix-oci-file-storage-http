    macros:
    - macro: '{$OCI.API.TENANCY}'
      description: OCI tenancy OCID. Same macro used by the official Oracle Cloud by HTTP template.
    - macro: '{$OCI.API.USER}'
      description: OCI API user OCID. Same macro used by the official Oracle Cloud by HTTP template.
    - macro: '{$OCI.API.FINGERPRINT}'
      type: SECRET_TEXT
      description: Fingerprint of the OCI API signing key.
    - macro: '{$OCI.API.PRIVATE.KEY}'
      type: SECRET_TEXT
      description: Entire PEM private key used for OCI API request signing.
    - macro: '{$OCI.FSS.REGION}'
      value: eu-milan-1
      description: OCI region monitored by this host. Resource Search is region-scoped.
    - macro: '{$OCI.FSS.REALM.DOMAIN}'
      value: oraclecloud.com
      description: OCI realm domain. For commercial OC1 use oraclecloud.com.
    - macro: '{$OCI.FSS.SEARCH.HOST}'
      value: ''
      description: Optional Resource Search endpoint override, without https://. Empty = query.<region>.oci.<realm-domain>.
    - macro: '{$OCI.FSS.FILE.HOST}'
      value: ''
      description: Optional File Storage API endpoint override, without https://. Empty = filestorage.<region>.<realm-domain>.
    - macro: '{$OCI.FSS.TELEMETRY.HOST}'
      value: ''
      description: Optional Monitoring API endpoint override. Empty = telemetry.<region>.<realm-domain>.
    - macro: '{$OCI.FSS.CORE.HOST}'
      value: ''
      description: Optional Core API endpoint override. Empty = iaas.<region>.<realm-domain>.
    - macro: '{$OCI.HTTP.PROXY}'
      value: ''
      description: Optional HTTP proxy used for all OCI API calls.
    - macro: '{$OCI.FSS.TLS.VERIFY}'
      value: full
      description: 'TLS validation mode: full, peer or none.'
    - macro: '{$OCI.FSS.RESOLVE.PRIVATE.IP}'
      value: '1'
      description: Resolve mount target privateIpIds through the OCI Core API. Set 0 if the API user cannot read private IP
        resources.
    - macro: '{$OCI.FSS.FS.NAME.MATCHES}'
      value: .*
      description: Regex of File System display names to discover.
    - macro: '{$OCI.FSS.FS.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Regex of File System names to exclude.
    - macro: '{$OCI.FSS.MT.NAME.MATCHES}'
      value: .*
      description: Regex of Mount Target display names to discover.
    - macro: '{$OCI.FSS.MT.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Regex of Mount Target names to exclude.
    - macro: '{$OCI.FSS.QUOTA.WARN}'
      value: '85'
      description: Warning threshold for FILE_SYSTEM_LEVEL hard quota usage, percent.
    - macro: '{$OCI.FSS.QUOTA.CRIT}'
      value: '95'
      description: High threshold for FILE_SYSTEM_LEVEL hard quota usage, percent.
    - macro: '{$OCI.FSS.LATENCY.WARN}'
      value: '0.05'
      description: Warning threshold for sustained file-system READ/WRITE latency, seconds.
    - macro: '{$OCI.FSS.LATENCY.CRIT}'
      value: '0.1'
      description: High threshold for sustained file-system READ/WRITE latency, seconds.
    - macro: '{$OCI.FSS.METADATA.LATENCY.WARN}'
      value: '0.05'
      description: Warning threshold for sustained metadata latency, seconds.
    - macro: '{$OCI.FSS.MT.HEALTH.WARN}'
      value: '99'
      description: Mount Target health warning threshold, percent successful requests.
    - macro: '{$OCI.FSS.MT.HEALTH.CRIT}'
      value: '95'
      description: Mount Target health high threshold, percent successful requests.
    valuemaps:
    - uuid: e4fbc1d8423144a49538faec520bd579
      name: OCI API status
      mappings:
      - value: '0'
        newvalue: Failed
      - value: '1'
        newvalue: Up
    - uuid: 759d3160f319461b8fa341d49fdf8dcf
      name: Boolean
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
    - uuid: 3a9575f41c2b448ab6bc34de01fbbb2d
